# Generate a docspec for a markdown file, then run Claude with the generated prompt.
# Add ANTHROPIC_API_KEY to repository secrets for manual runs.

name: Docspec generate

on:
  workflow_dispatch:
    inputs:
      markdown_file:
        description: 'Path to markdown file (e.g., README.md)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docspec-generate-${{ github.repository }}-${{ inputs.markdown_file }}
  cancel-in-progress: false

jobs:
  generate_docspec:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run docspec generate (prompt only)
        id: generate
        uses: ./.github/actions/docspec-generate
        with:
          markdown_file: ${{ inputs.markdown_file }}

      - name: Read prompt content
        id: prompt_content
        run: |
          PROMPT_FILE="${{ steps.generate.outputs.prompt_file }}"
          DELIM="DOCSPEC_EOF_$(date +%s)_$$"
          echo "content<<$DELIM" >> $GITHUB_OUTPUT
          cat "$PROMPT_FILE" >> $GITHUB_OUTPUT
          echo "$DELIM" >> $GITHUB_OUTPUT

      - name: Display full prompt
        run: |
          echo "=== Full prompt being sent to Claude ==="
          cat "${{ steps.generate.outputs.prompt_file }}"
          echo "=== End of prompt ==="

      - name: Run Claude Code with docspec prompt
        uses: anthropics/claude-code-action@v1
        with:
          prompt: ${{ steps.prompt_content.outputs.content }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
