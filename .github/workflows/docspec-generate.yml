# Generate a docspec for a markdown file (template only), then open a pull request. No LLM.

name: Docspec generate

on:
  workflow_dispatch:
    inputs:
      markdown_file:
        description: 'Path to markdown file (e.g., README.md)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docspec-generate-${{ github.repository }}-${{ inputs.markdown_file }}
  cancel-in-progress: false

jobs:
  generate_docspec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run docspec generate
        uses: ./.github/actions/docspec-generate
        with:
          markdown_file: ${{ inputs.markdown_file }}
