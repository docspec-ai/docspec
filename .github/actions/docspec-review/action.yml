name: 'Docspec Review'
description: 'Prepare a prompt file to review/sync markdown with docspecs (no LLM; feed prompt to your own LLM CLI). Use PR context or specific markdown file(s).'

inputs:
  # PR context (for git diff; optional if provided by workflow)
  pr_number:
    description: 'PR number that was merged (for workflow_dispatch). If not provided, will be extracted from event context.'
    required: false
  base_sha:
    description: 'Base SHA of the merged PR. If not provided, will be extracted from event context.'
    required: false
  merge_sha:
    description: 'Merge commit SHA. If not provided, will be extracted from event context.'
    required: false
  base_ref:
    description: 'Base branch name (e.g., main). If not provided, will be extracted from event context.'
    required: false
  # Manual review: specific markdown file(s) to review (comma- or newline-separated)
  review_files:
    description: 'Optional list of markdown file paths to review (e.g. README.md, docs/deploy.md). If set, only these docspecs are included; no PR diff.'
    required: false
  changed_files:
    description: 'Optional list of changed file paths (comma- or newline-separated). If set with base/merge, used for discovery.'
    required: false
  max_docspecs:
    description: 'Maximum number of docspec files to include in the prompt'
    required: false
    default: '10'
  max_diff_chars:
    description: 'Maximum characters of PR diff to include'
    required: false
    default: '120000'
  output_file:
    description: 'Path to write the prompt file (relative to workspace)'
    required: false
    default: 'prompt.txt'

outputs:
  prompt_file:
    description: 'Absolute path to the generated prompt file (empty if no docspecs found)'
    value: ${{ steps.prepare.outputs.prompt_file }}
  has_prompt:
    description: 'Whether a prompt was generated (true/false)'
    value: ${{ steps.prepare.outputs.has_prompt }}

runs:
  using: 'composite'
  steps:
    - name: Extract PR details if not provided
      id: pr_details
      shell: bash
      run: |
        if [ -n "${{ inputs.base_sha }}" ] && [ -n "${{ inputs.merge_sha }}" ]; then
          echo "base_sha=${{ inputs.base_sha }}" >> $GITHUB_OUTPUT
          echo "merge_sha=${{ inputs.merge_sha }}" >> $GITHUB_OUTPUT
          echo "base_ref=${{ inputs.base_ref }}" >> $GITHUB_OUTPUT
        elif [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.pr_number }}" ]; then
          PR_NUM="${{ inputs.pr_number }}"
          PR_DATA=$(gh pr view "$PR_NUM" --json baseRefName,baseRefOid,mergeCommit,headRefOid)
          MERGE_SHA=$(echo "$PR_DATA" | jq -r '.mergeCommit.oid // .headRefOid')
          echo "base_sha=$(echo "$PR_DATA" | jq -r '.baseRefOid')" >> $GITHUB_OUTPUT
          echo "merge_sha=$MERGE_SHA" >> $GITHUB_OUTPUT
          echo "base_ref=$(echo "$PR_DATA" | jq -r '.baseRefName')" >> $GITHUB_OUTPUT
        else
          echo "base_sha=${{ github.event.pull_request.base.sha }}" >> $GITHUB_OUTPUT
          echo "merge_sha=${{ github.event.pull_request.merge_commit_sha || github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
          echo "base_ref=${{ github.event.pull_request.base.ref }}" >> $GITHUB_OUTPUT
        fi
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install docspec
      shell: bash
      run: npm install -g docspec

    - name: Prepare docspec review prompt
      id: prepare
      shell: bash
      run: |
        REPO_ROOT="$GITHUB_WORKSPACE"
        PROMPT_FILE="$REPO_ROOT/${{ inputs.output_file }}"
        cd "$REPO_ROOT"

        if [ -n "${{ inputs.review_files }}" ]; then
          FILES=$(echo "${{ inputs.review_files }}" | tr '\n' ' ' | sed 's/  */ /g' | tr ',' ' ' | sed 's/  */ /g' | xargs)
          docspec review $FILES --output "${{ inputs.output_file }}" \
            --max-docspecs "${{ inputs.max_docspecs }}" || true
        elif [ -n "${{ inputs.changed_files }}" ]; then
          CHANGED=$(echo "${{ inputs.changed_files }}" | tr '\n' ',' | sed 's/,,*/,/g' | sed 's/^,//;s/,$//')
          BASE_REF="${{ steps.pr_details.outputs.base_ref }}"
          docspec review --changed-files "$CHANGED" --output "${{ inputs.output_file }}" \
            --max-docspecs "${{ inputs.max_docspecs }}" \
            --max-diff-chars "${{ inputs.max_diff_chars }}" \
            --base "${{ steps.pr_details.outputs.base_sha }}" --merge "${{ steps.pr_details.outputs.merge_sha }}" \
            ${BASE_REF:+--base-ref "$BASE_REF"} || true
        else
          BASE="${{ steps.pr_details.outputs.base_sha }}"
          MERGE="${{ steps.pr_details.outputs.merge_sha }}"
          BASE_REF="${{ steps.pr_details.outputs.base_ref }}"
          docspec review --base "$BASE" --merge "$MERGE" --output "${{ inputs.output_file }}" \
            --max-docspecs "${{ inputs.max_docspecs }}" \
            --max-diff-chars "${{ inputs.max_diff_chars }}" \
            ${BASE_REF:+--base-ref "$BASE_REF"} || true
        fi

        if [ -f "$PROMPT_FILE" ] && [ -s "$PROMPT_FILE" ]; then
          echo "prompt_file=$PROMPT_FILE" >> $GITHUB_OUTPUT
          echo "has_prompt=true" >> $GITHUB_OUTPUT
        else
          echo "prompt_file=" >> $GITHUB_OUTPUT
          echo "has_prompt=false" >> $GITHUB_OUTPUT
        fi
