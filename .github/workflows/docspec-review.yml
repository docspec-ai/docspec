# Run docspec review on a daily schedule (or manually) to produce a prompt, then run Claude.
# Add ANTHROPIC_API_KEY to repository secrets. Docspec does not run the LLM; this workflow
# uses the official Claude Code Action to run the generated prompt.
#
# Default mode is batch: reviews all commits since the last successful run (tracked by the
# docspec/last-run git tag, with a 24h fallback on first run). Callers should pass mode: batch
# and provide their own schedule trigger (schedule in a reusable workflow does not fire for callers).

name: Docspec review

on:
  schedule:
    # Runs in this repo only. Callers must declare their own schedule.
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'Optional base SHA override for batch backfill (default: docspec/last-run tag or 24h fallback)'
        required: false
        type: string
      review_files:
        description: 'Comma-separated markdown file(s) to review (e.g. README.md, docs/deploy.md). If set, reviews only these; no commit-window diff.'
        required: false
        type: string
      mode:
        description: "Prompt shape: 'batch' (default) or 'pr'/'inline'"
        required: false
        type: string
        default: 'batch'
  workflow_call:
    inputs:
      base_sha:
        description: 'Optional base SHA override for batch backfill'
        required: false
        type: string
      review_files:
        description: 'Comma-separated markdown file(s) to review'
        required: false
        type: string
      mode:
        description: "Prompt shape: 'batch' (default for callers) or 'pr'/'inline'"
        required: false
        type: string
        default: 'batch'
      since_tag:
        description: 'Git tag marking the previous successful batch run'
        required: false
        type: string
        default: 'docspec/last-run'
    secrets:
      ANTHROPIC_API_KEY:
        required: true
        description: 'Anthropic API key for Claude'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docspec-review-${{ github.repository }}
  cancel-in-progress: false

jobs:
  docspec_review_then_claude:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare docspec review prompt
        id: docspec
        uses: docspec-ai/docspec/.github/actions/docspec-review@main
        with:
          mode: ${{ inputs.mode || github.event.inputs.mode || 'batch' }}
          base_sha: ${{ inputs.base_sha || github.event.inputs.base_sha }}
          review_files: ${{ inputs.review_files || github.event.inputs.review_files }}
          since_tag: ${{ inputs.since_tag || 'docspec/last-run' }}

      - name: Run Claude Code with docspec prompt
        id: claude
        if: steps.docspec.outputs.has_prompt == 'true'
        uses: anthropics/claude-code-action/base-action@v1
        with:
          prompt_file: ${{ steps.docspec.outputs.prompt_file }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: --dangerously-skip-permissions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Advance last-run marker
        if: >-
          always()
          && (steps.docspec.outputs.has_prompt != 'true' || steps.claude.outcome == 'success')
          && steps.docspec.outputs.head_sha != ''
        shell: bash
        env:
          HEAD_SHA: ${{ steps.docspec.outputs.head_sha }}
          SINCE_TAG: ${{ inputs.since_tag || 'docspec/last-run' }}
        run: |
          set -euo pipefail
          if [ -z "${HEAD_SHA}" ]; then
            echo "No head SHA resolved; skipping tag advance."
            exit 0
          fi
          git tag -f "${SINCE_TAG}" "${HEAD_SHA}"
          git push -f origin "refs/tags/${SINCE_TAG}"
          echo "Advanced ${SINCE_TAG} -> ${HEAD_SHA}"
