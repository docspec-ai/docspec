# Run docspec review on PR merge (or manually for specific files) to produce a prompt, then run Claude.
# Add ANTHROPIC_API_KEY to repository secrets. Docspec does not run the LLM; this workflow
# uses the official Claude Code Action to run the generated prompt.

name: Docspec review

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number (for manual run with PR context)'
        required: false
        type: string
      review_files:
        description: 'Comma-separated markdown file(s) to review (e.g. README.md, docs/deploy.md). If set, reviews only these; no PR diff.'
        required: false
        type: string
  workflow_call:
    inputs:
      pr_number:
        description: 'PR number (when calling from another repo with PR context)'
        required: false
        type: string
      review_files:
        description: 'Comma-separated markdown file(s) to review'
        required: false
        type: string
    secrets:
      ANTHROPIC_API_KEY:
        required: true
        description: 'Anthropic API key for Claude'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docspec-review-${{ github.repository }}
  cancel-in-progress: false

jobs:
  docspec_review_then_claude:
    # Skip when the merged PR is from a docspec-generated branch to avoid re-running on docspec's own PRs.
    if: >-
      (github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch')
      && (github.event_name != 'pull_request'
          || (!startsWith(github.event.pull_request.head.ref, 'docspec/')
              && !startsWith(github.event.pull_request.head.ref, 'docspec-')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare docspec review prompt
        id: docspec
        uses: docspec-ai/docspec/.github/actions/docspec-review@main
        with:
          pr_number: ${{ inputs.pr_number || github.event.inputs.pr_number }}
          review_files: ${{ inputs.review_files || github.event.inputs.review_files }}

      - name: Run Claude Code with docspec prompt
        if: steps.docspec.outputs.has_prompt == 'true'
        uses: anthropics/claude-code-action/base-action@v1
        with:
          prompt_file: ${{ steps.docspec.outputs.prompt_file }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: --dangerously-skip-permissions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
