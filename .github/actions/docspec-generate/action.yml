name: 'Docspec Generate'
description: 'Generate a docspec for a markdown file and prepare a prompt for your LLM (no LLM run; feed prompt to your own CLI)'

inputs:
  markdown_file:
    description: 'Path to the markdown file (e.g., README.md)'
    required: true
  overwrite:
    description: 'If true, overwrite existing docspec file. If false and docspec exists, action will fail.'
    required: false
    default: 'false'
  output_prompt_file:
    description: 'Path to write the implementation prompt file (relative to workspace)'
    required: false
    default: 'prompt.txt'
  output_plan_file:
    description: 'Optional path to write the plan prompt file'
    required: false

outputs:
  prompt_file:
    description: 'Absolute path to the generated prompt file'
    value: ${{ steps.prepare.outputs.prompt_file }}

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install docspec
      run: npm install -g docspec

    - name: Prepare docspec generate prompt
      id: prepare
      shell: bash
      run: |
        REPO_ROOT="$GITHUB_WORKSPACE"
        cd "$REPO_ROOT"
        CMD="docspec generate ${{ inputs.markdown_file }} --output-prompt ${{ inputs.output_prompt_file }}"
        [ "${{ inputs.overwrite }}" = "true" ] && CMD="$CMD --overwrite"
        [ -n "${{ inputs.output_plan_file }}" ] && CMD="$CMD --output-plan ${{ inputs.output_plan_file }}"
        $CMD
        echo "prompt_file=$REPO_ROOT/${{ inputs.output_prompt_file }}" >> $GITHUB_OUTPUT
