# Run docspec changed on PR merge to produce a prompt, then run Claude with that prompt.
# Add ANTHROPIC_API_KEY to repository secrets. Docspec does not run the LLM; this workflow
# uses the official Claude Code Action to run the generated prompt.

name: Docspec changed

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number (for manual run)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docspec-changed-${{ github.repository }}
  cancel-in-progress: false

jobs:
  docspec_then_claude:
    if: ${{ github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare docspec changed prompt
        id: docspec
        uses: ./.github/actions/docspec-check
        with:
          pr_number: ${{ github.event.inputs.pr_number }}

      - name: Read prompt content
        id: prompt_content
        if: steps.docspec.outputs.has_prompt == 'true'
        run: |
          PROMPT_FILE="${{ steps.docspec.outputs.prompt_file }}"
          DELIM="DOCSPEC_EOF_$(date +%s)_$$"
          echo "content<<$DELIM" >> $GITHUB_OUTPUT
          cat "$PROMPT_FILE" >> $GITHUB_OUTPUT
          echo "$DELIM" >> $GITHUB_OUTPUT

      - name: Display full prompt
        if: steps.docspec.outputs.has_prompt == 'true'
        run: |
          echo "=== Full prompt being sent to Claude ==="
          cat "${{ steps.docspec.outputs.prompt_file }}"
          echo "=== End of prompt ==="

      - name: Run Claude Code with docspec prompt
        if: steps.docspec.outputs.has_prompt == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          prompt: ${{ steps.prompt_content.outputs.content }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
