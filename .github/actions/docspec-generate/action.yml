name: 'Docspec Generate'
description: 'Write or overwrite a docspec file from the template for a markdown file, then open a pull request. No LLM.'

inputs:
  markdown_file:
    description: 'Path to the markdown file (e.g., README.md)'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install docspec
      shell: bash
      run: npm install -g docspec

    - name: Generate docspec and open PR
      shell: bash
      run: |
        cd "$GITHUB_WORKSPACE"
        docspec generate "${{ inputs.markdown_file }}"
